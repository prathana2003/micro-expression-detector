[project]
name = "micro-expression-detector"
version = "0.1.0"
description = "Real-time micro-expression and facial signal detection system"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "opencv-python-headless==4.10.0.84",
    "mediapipe==0.10.35",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "websockets==12.0"
]

[tool.vercel]
entrypoint = "backend.app.main:app"